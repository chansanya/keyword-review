<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网关检查站</title>
<style>
  :root {
    --bg: #E4E9EE;
    --surface: #FAFBFC;
    --ink: #1B2A41;
    --ink-soft: #55647A;
    --line: #C9D1DA;
    --pass: #17785F;
    --block: #B8122B;
    --warn: #A86F00;
    --focus: #2F5BD3;
    --code-bg: #EEF2F6;

    --sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141B26;
      --surface: #1C2533;
      --ink: #E3E8EF;
      --ink-soft: #97A3B6;
      --line: #2E3A4C;
      --pass: #4CC3A0;
      --block: #FF6B7D;
      --warn: #E8B44A;
      --focus: #7FA2FF;
      --code-bg: #141B26;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 var(--sans);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .page { max-width: 880px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ---------- 头部 ---------- */
  header.top {
    padding-bottom: 20px; border-bottom: 2px solid var(--ink);
  }
  .title { font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: .04em; margin: 0; }

  /* ---------- 连接设置 ---------- */
  .settings {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px 16px;
    padding: 24px 0; border-bottom: 1px solid var(--line);
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.w2 { grid-column: span 2; }
  .field.w3 { grid-column: span 3; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface);
  }
  .field input:focus-visible, .field select:focus-visible { outline-offset: 0; }
  .field-control { display: flex; gap: 6px; min-width: 0; }
  .field-control select { flex: 1; min-width: 0; }

  /* ---------- 主体单栏 ---------- */
  .main { margin-top: 28px; }
  h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 9px 20px; border-radius: 6px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--surface); font-weight: 600;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.small { padding: 4px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; }

  /* ---------- 印章 ---------- */
  .stamp {
    --c: var(--ink-soft);
    display: inline-block; min-width: 4.2em; text-align: center;
    padding: 2px 10px; border: 2.5px solid var(--c); border-radius: 5px;
    box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--c);
    color: var(--c); font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: .2em;
    transform: rotate(-5deg); background: var(--surface); white-space: nowrap;
  }
  .stamp.idle { border-style: dashed; box-shadow: none; transform: none; opacity: .7; letter-spacing: .05em; font-weight: 400; font-family: var(--sans); font-size: 13px; }
  .stamp.run  { --c: var(--focus); border-style: dashed; box-shadow: none; transform: none; font-family: var(--sans); font-weight: 400; font-size: 13px; letter-spacing: .05em; animation: blink 1s ease-in-out infinite; }
  .stamp.pass { --c: var(--pass); }
  .stamp.fail { --c: var(--block); }
  .stamp.warn { --c: var(--warn); }
  .stamp.land { animation: land .32s cubic-bezier(.2, 1.6, .5, 1) both; }
  @keyframes land { from { transform: rotate(-14deg) scale(1.9); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
  @keyframes blink { 50% { opacity: .45; } }

  /* ---------- 手动测试区 ---------- */
  .playground { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
  .playground textarea {
    width: 100%; min-height: 120px; resize: vertical; padding: 12px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  }
  .pg-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 16px; }
  .pg-opts { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--ink-soft); }
  .pg-opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { cursor: pointer; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; color: var(--ink-soft); }
  .chip:hover { border-color: var(--ink-soft); color: var(--ink); }

  .verdict { display: flex; align-items: center; gap: 14px; min-height: 40px; padding: 10px 0 14px; border-top: 1px dashed var(--line); }
  .verdict-text { font-size: 14px; color: var(--ink-soft); }

  /* ---------- 响应展示 Tab ---------- */
  .response-tabs { display: flex; gap: 8px; margin: 16px 0 12px; border-bottom: 1.5px solid var(--line); padding-bottom: 8px; }
  .tab-btn {
    background: none; border: none; padding: 6px 14px; font-size: 14px; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; border-radius: 4px; transition: all .15s ease;
  }
  .tab-btn:hover { color: var(--ink); background: var(--code-bg); }
  .tab-btn.active { color: var(--surface); background: var(--ink); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .pane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--ink-soft); }
  .copy-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--ink-soft);
  }
  .copy-btn:hover { color: var(--ink); border-color: var(--ink); }

  .answer {
    min-height: 140px; max-height: 460px; overflow: auto; padding: 14px 16px;
    border-radius: 6px; background: var(--bg); white-space: pre-wrap; word-break: break-word;
  }
  .answer.empty { color: var(--ink-soft); }

  .code-view {
    margin: 0; padding: 12px 14px; max-height: 460px; overflow: auto;
    background: var(--code-bg); border-radius: 6px; border: 1px solid var(--line);
    font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all;
  }

  .banner { display: none; margin-top: 16px; padding: 10px 14px; border-left: 3px solid var(--block); background: var(--surface); font-size: 14px; }
  .banner.show { display: block; }

  @media (max-width: 800px) {
    .settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field.w2, .field.w3 { grid-column: span 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.land, .stamp.run { animation: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1 class="title">网关检查站</h1>
  </header>

  <section class="settings" aria-label="连接设置">
    <div class="field w2">
      <label for="f-base">网关地址</label>
      <input id="f-base" value="http://127.0.0.1:8080" autocomplete="off" spellcheck="false">
    </div>
    <div class="field w2">
      <label for="f-path">接口路径</label>
      <input id="f-path" value="/v1/chat/completions" autocomplete="off" spellcheck="false">
    </div>
    <div class="field w2">
      <label for="f-model">模型</label>
      <div class="field-control">
        <select id="f-model" aria-label="选择模型">
          <option value="">点击加载模型</option>
        </select>
        <button class="btn ghost small" id="load-models" type="button">加载模型</button>
      </div>
    </div>
    <div class="field w3">
      <label for="f-gwkey">网关 key（可选）</label>
      <input id="f-gwkey" type="password" placeholder="x-gateway-key（可选）" autocomplete="off">
    </div>
    <div class="field w3">
      <label for="f-upkey">上游 key（可选）</label>
      <input id="f-upkey" type="password" placeholder="Authorization: Bearer（可选）" autocomplete="off">
    </div>
    <div class="field w3">
      <label for="f-word">测试敏感词</label>
      <input id="f-word" value="自定义敏感词示例1" autocomplete="off">
    </div>
    <div class="field w3">
      <label for="f-deny">拦截提示关键字</label>
      <input id="f-deny" value="屏蔽" autocomplete="off">
    </div>
  </section>

  <div class="banner" id="banner" role="alert"></div>

  <div class="main">
    <section aria-labelledby="h-pg">
      <div class="section-head">
        <h2 id="h-pg">手动发送</h2>
      </div>
      <div class="playground">
        <textarea id="pg-input" placeholder="例如：我的手机号是 13800138000，帮我写一段自我介绍"></textarea>
        <div class="presets" id="presets"></div>
        <div class="pg-bar">
          <div class="pg-opts">
            <label><input type="checkbox" id="pg-stream" checked> 流式输出</label>
            <label><input type="checkbox" id="pg-nokey"> 不带网关 key</label>
          </div>
          <button class="btn" id="pg-send">发送</button>
        </div>
        <div class="verdict">
          <span class="stamp idle" id="pg-stamp">等待发送</span>
          <span class="verdict-text" id="pg-verdict"></span>
        </div>

        <div class="response-tabs" role="tablist">
          <button class="tab-btn active" id="tab-btn-client" type="button" data-pane="pane-client">客户端最终响应</button>
          <button class="tab-btn" id="tab-btn-raw" type="button" data-pane="pane-raw">网关原生响应</button>
          <button class="tab-btn" id="tab-btn-req" type="button" data-pane="pane-req">请求报文</button>
        </div>

        <div class="tab-pane active" id="pane-client">
          <div class="pane-header">
            <span>客户端提取内容（解析后的文本回复或拦截提示）</span>
            <button class="copy-btn" id="copy-client" type="button">复制最终响应</button>
          </div>
          <div class="answer empty" id="pg-answer" aria-live="polite">模型的回复会显示在这里。</div>
        </div>

        <div class="tab-pane" id="pane-raw">
          <div class="pane-header">
            <span id="raw-info-header">网关返回的完整原生数据（原始 HTTP 报文 / SSE 数据流）</span>
            <button class="copy-btn" id="copy-raw" type="button">复制原生响应</button>
          </div>
          <pre class="code-view" id="pg-raw">（暂无响应）</pre>
        </div>

        <div class="tab-pane" id="pane-req">
          <div class="pane-header">
            <span>实际发往网关的请求（含首次明文 key）</span>
            <button class="copy-btn" id="copy-req" type="button">复制请求报文</button>
          </div>
          <pre class="code-view" id="pg-req">（暂无请求）</pre>
        </div>

      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fields = ["f-base", "f-path", "f-model", "f-word", "f-deny"];
  const STORE = "gw-tester-settings";
  let preferredModel = "";
  let lastPrintedKey = "";

  const gatewayScheme = location.protocol === "https:" ? "https" : "http";
  const gatewayPort = gatewayScheme === "https" ? "8443" : "8080";
  const defaultGateway = `${gatewayScheme}://${location.hostname || "127.0.0.1"}:${gatewayPort}`;
  $("f-base").value = defaultGateway;

  // ---- Tab 切换 ----
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      const targetPane = $(btn.dataset.pane);
      if (targetPane) targetPane.classList.add("active");
    });
  });

  // ---- 复制函数 ----
  function setupCopy(btnId, targetId, isValue) {
    const btn = $(btnId);
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const el = $(targetId);
      if (!el) return;
      const text = isValue ? el.value : (el.textContent || "");
      try {
        await navigator.clipboard.writeText(text);
        const oldText = btn.textContent;
        btn.textContent = "已复制!";
        setTimeout(() => { btn.textContent = oldText; }, 1500);
      } catch (_) {
        btn.textContent = "复制失败";
        setTimeout(() => { btn.textContent = "复制"; }, 1500);
      }
    });
  }
  setupCopy("copy-client", "pg-answer", false);
  setupCopy("copy-raw", "pg-raw", false);
  setupCopy("copy-req", "pg-req", false);

  // ---- 设置的保存与读取（不保存 key）----
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    fields.forEach((id) => {
      if (!saved[id]) return;
      if (id === "f-model") {
        preferredModel = saved[id];
        const select = $("f-model");
        const opt = document.createElement("option");
        opt.value = preferredModel;
        opt.textContent = preferredModel;
        select.replaceChildren(opt);
        select.value = preferredModel;
      } else {
        $(id).value = (id === "f-base" && saved[id] === "/gw") ? defaultGateway : saved[id];
      }
    });
  } catch (_) {}

  fields.forEach((id) => $(id).addEventListener("change", () => {
    try {
      const data = {};
      fields.forEach((f) => (data[f] = $(f).value));
      localStorage.setItem(STORE, JSON.stringify(data));
    } catch (_) {}
  }));

  const cfg = () => ({
    url: $("f-base").value.replace(/\/+$/, "") + "/" + $("f-path").value.replace(/^\/+/, ""),
    model: $("f-model").value.trim(),
    gwKey: $("f-gwkey").value.trim(),
    upKey: $("f-upkey").value.trim(),
    word: $("f-word").value.trim(),
    deny: $("f-deny").value.trim() || "屏蔽",
  });

  function banner(msg) {
    const b = $("banner");
    b.textContent = msg || "";
    b.classList.toggle("show", !(!msg));
  }

  // ---- 加载模型按钮 ----
  $("load-models").addEventListener("click", async () => {
    const c = cfg();
    const button = $("load-models");
    const select = $("f-model");

    button.disabled = true;
    button.textContent = "加载中…";
    banner("");

    try {
      const headers = {};
      if (c.gwKey) headers["x-gateway-key"] = c.gwKey;
      if (c.upKey) headers["Authorization"] = "Bearer " + c.upKey;
      const base = $("f-base").value.trim().replace(/\/+$/, "");
      const response = await fetch(base + "/v1/models", { headers });
      const raw = await response.text();
      let result;
      try { result = JSON.parse(raw); } catch (_) { result = null; }
      if (!response.ok) {
        const message = result?.error?.message || result?.message || `HTTP ${response.status}`;
        throw new Error(String(message).slice(0, 180));
      }

      const models = Array.isArray(result?.data) ? result.data
        : Array.isArray(result?.models) ? result.models
        : Array.isArray(result) ? result : [];
      const ids = [...new Set(models.map((m) => typeof m === "string" ? m : m?.id).filter((id) => typeof id === "string" && id.trim()))];
      if (!ids.length) throw new Error("接口未返回可用模型列表");

      const previous = select.value || preferredModel;
      const options = ids.map((id) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = id;
        return option;
      });
      select.replaceChildren(...options);
      select.value = ids.includes(previous) ? previous : ids[0];
      preferredModel = select.value;
      select.dispatchEvent(new Event("change"));
      button.textContent = `已加载(${ids.length})`;
      setTimeout(() => { button.textContent = "加载模型"; }, 2000);
    } catch (error) {
      banner("加载模型失败: " + error.message);
      button.textContent = "加载模型";
    } finally {
      button.disabled = false;
    }
  });

  // ---- 发请求：同时支持普通 JSON 和 SSE 流式 ----
  async function send({ text, stream, gwKey, onDelta, onRawChunk }) {
    const c = cfg();
    const headers = { "Content-Type": "application/json" };
    if (gwKey) headers["x-gateway-key"] = gwKey;
    if (c.upKey) headers["Authorization"] = "Bearer " + c.upKey;
    const body = { model: c.model, stream, messages: [{ role: "user", content: text }] };

    const t0 = performance.now();
    const res = await fetch(c.url, { method: "POST", headers, body: JSON.stringify(body) });
    const type = res.headers.get("content-type") || "";
    let raw = "", content = "";

    if (res.body && type.includes("text/event-stream")) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const chunk = dec.decode(value, { stream: true });
        raw += chunk;
        if (onRawChunk) onRawChunk(raw);
        buf += chunk;
        const lines = buf.split(/\r?\n/);
        buf = lines.pop();
        for (const line of lines) {
          const m = line.match(/^data:\s?(.*)$/);
          if (!m || m[1] === "[DONE]") continue;
          try {
            const j = JSON.parse(m[1]);
            const d = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content ?? "";
            if (d) { content += d; onDelta && onDelta(content); }
          } catch (_) {}
        }
      }
    } else {
      raw = await res.text();
      try {
        const j = JSON.parse(raw);
        content = j.choices?.[0]?.message?.content ?? j.error?.message ?? j.errmsg ?? j.message ?? raw;
      } catch (_) { content = raw; }
      onDelta && onDelta(content);
      if (onRawChunk) onRawChunk(raw);
    }
    return { status: res.status, ms: Math.round(performance.now() - t0), raw, content, reqHeaders: headers, reqBody: body };
  }

  const mask = (s) => (s.length <= 8 ? "****" : s.slice(0, 4) + "…" + s.slice(-4));

  function fmtRequest(r) {
    const h = { ...r.reqHeaders };
    const currentKey = h["x-gateway-key"];
    if (currentKey) {
      if (lastPrintedKey !== currentKey) {
        lastPrintedKey = currentKey;
        console.log("[网关认证 key 首次明文展示]:", currentKey);
        // 首次打印明文，不遮盖
      } else {
        h["x-gateway-key"] = mask(currentKey);
      }
    }
    if (h["Authorization"]) h["Authorization"] = "Bearer " + mask(h["Authorization"].slice(7));
    return JSON.stringify({ headers: h, body: r.reqBody }, null, 2);
  }

  function setStamp(el, state, text) {
    el.className = "stamp " + state;
    el.textContent = text;
    if (["pass", "fail", "warn"].includes(state)) {
      void el.offsetWidth;
      el.classList.add("land");
    }
  }

  // ---- 预设用例 ----
  const presets = [
    ["普通提问", "用三句话介绍一下杭州"],
    ["含手机号", "我的手机号是 13800138000，请原样复述"],
    ["含邮箱", "把 zhangsan@example.com 这个邮箱原样写出来"],
    ["含密钥", "帮我检查这个 key 格式对不对：sk-abcdefghijklmnopqrstuvwxyz123456"],
    ["含敏感词", null],
  ];
  presets.forEach(([label, text]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", () => {
      $("pg-input").value = text ?? `请解释一下：${cfg().word}`;
      $("pg-input").focus();
    });
    $("presets").appendChild(b);
  });

  // ---- 发送逻辑 ----
  $("pg-send").addEventListener("click", async () => {
    const text = $("pg-input").value.trim();
    if (!text) { $("pg-input").focus(); return; }
    const noKey = $("pg-nokey").checked;
    const c = cfg();

    if (!c.model) {
      banner("请先选择模型（点击“加载模型”）。");
      $("load-models").focus();
      return;
    }
    banner("");

    const btn = $("pg-send");
    const ans = $("pg-answer");
    const rawEl = $("pg-raw");
    const reqEl = $("pg-req");

    btn.disabled = true;
    setStamp($("pg-stamp"), "run", "发送中");
    $("pg-verdict").textContent = "";
    ans.classList.remove("empty");
    ans.textContent = "";
    rawEl.textContent = "（正在接收原生流式响应…）";
    reqEl.textContent = "（等待生成请求报文…）";

    try {
      const actualGwKey = noKey ? null : (c.gwKey || null);
      const isStream = $("pg-stream").checked;

      const r = await send({
        text,
        stream: isStream,
        gwKey: actualGwKey,
        onDelta: (s) => {
          ans.textContent = s;
          ans.scrollTop = ans.scrollHeight;
        },
        onRawChunk: (rawChunk) => {
          rawEl.textContent = `<<< HTTP (Streaming)\n\n` + rawChunk;
          rawEl.scrollTop = rawEl.scrollHeight;
        },
      });

      // 1. 请求报文
      reqEl.textContent = `POST ${c.url}\n\n` + fmtRequest(r);

      // 2. 原生响应
      rawEl.textContent = `<<< HTTP ${r.status} (${r.ms} ms)\n\n` + (r.raw || "（空响应体）");

      // 3. 客户端最终响应
      if (!r.content) {
        ans.textContent = "（没有提取到客户端回复内容）";
        ans.classList.add("empty");
      }

      let state = "pass", label = "已放行", why = `HTTP ${r.status}，耗时 ${r.ms} ms`;
      if (r.status === 401 || r.status === 403) {
        state = "fail";
        label = "未认证";
        why = "网关拒绝了请求：未提供网关 key、key 错误或无权访问该路由";
      } else if (r.status === 429) {
        state = "warn";
        label = "被限流";
        why = "超出 token 限流额度，请稍后再试";
      } else if (r.content.includes(c.deny) || r.raw.includes(c.deny)) {
        state = "fail";
        label = "已拦截";
        why = "内容命中敏感词，已被网关拦截";
      } else if (r.status >= 400) {
        state = "warn";
        label = "上游异常";
        why = `上游返回 HTTP ${r.status}，可切换到“网关原生响应”查看原因`;
      } else if (/\*{4}/.test(r.content) || /[0-9a-f]{32}/.test(r.content)) {
        label = "脱敏放行";
        why = "检测到回复中包含脱敏掩码，脱敏已生效";
      }

      setStamp($("pg-stamp"), state, label);
      $("pg-verdict").textContent = why;
    } catch (err) {
      setStamp($("pg-stamp"), "fail", "请求失败");
      $("pg-verdict").textContent = "请求发送失败：" + err.message;
      rawEl.textContent = "（网络或连接错误：" + err.message + "）";
    } finally {
      btn.disabled = false;
    }
  });

  $("pg-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("pg-send").click();
  });
})();
</script>
</body>
</html>
