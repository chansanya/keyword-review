<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网关检查站</title>
<style>
  :root {
    --bg: #E4E9EE;
    --surface: #FAFBFC;
    --ink: #1B2A41;
    --ink-soft: #55647A;
    --line: #C9D1DA;
    --pass: #17785F;
    --block: #B8122B;
    --warn: #A86F00;
    --focus: #2F5BD3;
    --code-bg: #EEF2F6;

    --sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141B26;
      --surface: #1C2533;
      --ink: #E3E8EF;
      --ink-soft: #97A3B6;
      --line: #2E3A4C;
      --pass: #4CC3A0;
      --block: #FF6B7D;
      --warn: #E8B44A;
      --focus: #7FA2FF;
      --code-bg: #141B26;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 var(--sans);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ---------- 头部 ---------- */
  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px 32px; padding-bottom: 24px; border-bottom: 2px solid var(--ink);
  }
  .title { font-family: var(--serif); font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: .04em; margin: 0; }
  .subtitle { margin: 8px 0 0; color: var(--ink-soft); max-width: 46em; }

  /* ---------- 连接设置 ---------- */
  .settings {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 16px;
    padding: 20px 0 24px; border-bottom: 1px solid var(--line);
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.w2 { grid-column: span 2; }
  .field label { font-size: 13px; color: var(--ink-soft); }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface);
  }
  .field input:focus-visible, .field select:focus-visible { outline-offset: 0; }
  .field-control { display: flex; gap: 6px; min-width: 0; }
  .field-control select { flex: 1; min-width: 0; }
  .model-status { min-height: 19px; }
  .hint { font-size: 12px; color: var(--ink-soft); }

  /* ---------- 主体两栏 ---------- */
  .main { max-width: 720px; margin-top: 28px; }
  h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 9px 18px; border-radius: 6px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--surface); font-weight: 600;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn[disabled] { opacity: .55; cursor: progress; }
  pre.code {
    margin: 0; padding: 10px 12px; max-height: 260px; overflow: auto;
    background: var(--code-bg); border-radius: 6px; border: 1px solid var(--line);
    font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all;
  }

  /* ---------- 印章：页面上唯一的“大动作�?---------- */
  .stamp {
    --c: var(--ink-soft);
    display: inline-block; min-width: 4.2em; text-align: center;
    padding: 2px 10px; border: 2.5px solid var(--c); border-radius: 5px;
    box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 3px var(--c);
    color: var(--c); font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: .2em;
    transform: rotate(-5deg); background: var(--surface); white-space: nowrap;
  }
  .stamp.idle { border-style: dashed; box-shadow: none; transform: none; opacity: .7; letter-spacing: .05em; font-weight: 400; font-family: var(--sans); font-size: 13px; }
  .stamp.run  { --c: var(--focus); border-style: dashed; box-shadow: none; transform: none; font-family: var(--sans); font-weight: 400; font-size: 13px; letter-spacing: .05em; animation: blink 1s ease-in-out infinite; }
  .stamp.pass { --c: var(--pass); }
  .stamp.fail { --c: var(--block); }
  .stamp.warn { --c: var(--warn); }
  .stamp.land { animation: land .32s cubic-bezier(.2, 1.6, .5, 1) both; }
  @keyframes land { from { transform: rotate(-14deg) scale(1.9); opacity: 0; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
  @keyframes blink { 50% { opacity: .45; } }

  /* ---------- 试一�?---------- */
  .playground { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .playground textarea {
    width: 100%; min-height: 120px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  }
  .pg-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 16px; }
  .pg-opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--ink-soft); }
  .pg-opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { cursor: pointer; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; color: var(--ink-soft); }
  .chip:hover { border-color: var(--ink-soft); color: var(--ink); }

  .verdict { display: flex; align-items: center; gap: 14px; min-height: 40px; padding: 8px 0 12px; border-top: 1px dashed var(--line); }
  .verdict-text { font-size: 14px; color: var(--ink-soft); }
  .answer {
    min-height: 140px; max-height: 360px; overflow: auto; padding: 12px 14px;
    border-radius: 6px; background: var(--bg); white-space: pre-wrap; word-break: break-word;
  }
  .answer.empty { color: var(--ink-soft); }
  details.raw { margin-top: 12px; }
  details.raw summary { cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  details.raw pre { margin-top: 8px; }

  .banner { display: none; margin-top: 16px; padding: 10px 14px; border-left: 3px solid var(--block); background: var(--surface); font-size: 14px; }
  .banner.show { display: block; }

  footer { margin-top: 40px; font-size: 13px; color: var(--ink-soft); }

  @media (max-width: 920px) {
    .settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field.w2 { grid-column: span 2; }
  }
  @media (max-width: 520px) {
    .page { padding: 20px 16px 48px; }
    .title { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.land, .stamp.run { animation: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div>
      <h1 class="title">网关检查站</h1>
      <p class="subtitle">�?Higress 网关发送请求，观察放行、拦截或脱敏效果。页面直接请求下方填写的网关地址�?/p>
    </div>
  </header>

  <section class="settings" aria-label="连接设置">
    <div class="field">
      <label for="f-base">网关地址</label>
      <input id="f-base" value="http://127.0.0.1:8080" autocomplete="off" spellcheck="false">
      <span class="hint">若页面与网关端口不同，需�?Higress 路由允许此页面来源的 CORS 请求</span>
    </div>
    <div class="field">
      <label for="f-path">接口路径</label>
      <input id="f-path" value="/v1/chat/completions" autocomplete="off" spellcheck="false">
    </div>
    <div class="field w2">
      <label for="f-model">模型</label>
      <div class="field-control">
        <select id="f-model" aria-label="选择模型" disabled>
          <option value="">请先加载模型</option>
        </select>
        <button class="btn ghost small" id="load-models" type="button">加载模型</button>
      </div>
      <span class="hint model-status" id="model-status" aria-live="polite">从网�?GET /v1/models 加载</span>
    </div>
    <div class="field">
      <label for="f-gwkey">网关 key</label>
      <input id="f-gwkey" type="password" placeholder="x-gateway-key" autocomplete="off">
    </div>
    <div class="field w2">
      <label for="f-upkey">上游 key（可选）</label>
      <input id="f-upkey" type="password" placeholder="作为 Authorization: Bearer 发�? autocomplete="off">
    </div>
    <div class="field w2">
      <label for="f-word">测试用敏感词</label>
      <input id="f-word" value="绘王" autocomplete="off">
      <span class="hint">填一个已配置�?deny_words 里的�?/span>
    </div>
    <div class="field w2">
      <label for="f-deny">拦截提示里的关键�?/label>
      <input id="f-deny" value="屏蔽" autocomplete="off">
      <span class="hint">响应中出现这几个字即视为被拦截，对应 deny_message</span>
    </div>
    <div class="field w2" style="justify-content:flex-end">
      <span class="hint">两个 key 只保存在当前页面内存中，刷新后需要重新填写；其余设置会记在本机浏览器里�?/span>
    </div>
  </section>

  <div class="banner" id="banner" role="alert"></div>

  <div class="main">
    <!-- 手动发�?-->
    <section aria-labelledby="h-pg">
      <div class="section-head">
        <h2 id="h-pg">手动发�?/h2>
      </div>
      <div class="playground">
        <label for="pg-input" class="hint">输入任意内容，看网关会放行、拦截还是脱�?/label>
        <textarea id="pg-input" placeholder="例如：我的手机号�?13800138000，帮我写一段自我介�?></textarea>
        <div class="presets" id="presets"></div>
        <div class="pg-bar">
          <div class="pg-opts">
            <label><input type="checkbox" id="pg-stream" checked> 流式输出</label>
            <label><input type="checkbox" id="pg-nokey"> 不带网关 key</label>
          </div>
          <button class="btn" id="pg-send">发�?/button>
        </div>
        <div class="verdict">
          <span class="stamp idle" id="pg-stamp">等待发�?/span>
          <span class="verdict-text" id="pg-verdict"></span>
        </div>
        <div class="answer empty" id="pg-answer" aria-live="polite">模型的回复会显示在这里�?/div>
        <details class="raw">
          <summary>查看原始响应</summary>
          <pre class="code" id="pg-raw">（暂无）</pre>
        </details>
      </div>
    </section>
  </div>

  <footer>
    检查项 6 依赖模型是否照做复述，结果标为“待确认”时请展开查看回复内容。限流需要大量请求才能触发，没有放进自动检查�?  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fields = ["f-base", "f-path", "f-model", "f-word", "f-deny"];
  const STORE = "gw-tester-settings";
  let preferredModel = "";
  let keyPrinted = false;   // 网关 key 只明文展示一次
  const gatewayScheme = location.protocol === "https:" ? "https" : "http";
  const gatewayPort = gatewayScheme === "https" ? "8443" : "8080";
  const defaultGateway = `${gatewayScheme}://${location.hostname || "127.0.0.1"}:${gatewayPort}`;
  $("f-base").value = defaultGateway;

  // ---- 设置的保存与读取（不保存 key）----
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    fields.forEach((id) => {
      if (!saved[id]) return;
      if (id === "f-model") preferredModel = saved[id];
      else $(`${id}`).value = (id === "f-base" && saved[id] === "/gw") ? defaultGateway : saved[id];
    });
  } catch (_) {}
  fields.forEach((id) => $(`${id}`).addEventListener("change", () => {
    try {
      const data = {};
      fields.forEach((f) => (data[f] = $(`${f}`).value));
      localStorage.setItem(STORE, JSON.stringify(data));
    } catch (_) {}
  }));

  const cfg = () => ({
    url: $("f-base").value.replace(/\/+$/, "") + "/" + $("f-path").value.replace(/^\/+/, ""),
    model: $("f-model").value.trim(),
    gwKey: $("f-gwkey").value.trim(),
    upKey: $("f-upkey").value.trim(),
    word: $("f-word").value.trim(),
    deny: $("f-deny").value.trim() || "屏蔽",
  });

  function banner(msg) {
    const b = $("banner");
    b.textContent = msg || "";
    b.classList.toggle("show", !!msg);
  }

  $("load-models").addEventListener("click", async () => {
    const c = cfg();
    const status = $("model-status");
    const button = $("load-models");

    button.disabled = true;
    status.textContent = "正在加载…";
    try {
      const headers = {};
      if (c.gwKey) headers["x-gateway-key"] = c.gwKey;
      if (c.upKey) headers.Authorization = "Bearer " + c.upKey;
      const base = $("f-base").value.trim().replace(/\/+$/, "");
      const response = await fetch(base + "/v1/models", { headers });
      const raw = await response.text();
      let result;
      try { result = JSON.parse(raw); } catch (_) { result = null; }
      if (!response.ok) {
        const message = result?.error?.message || result?.message || `HTTP ${response.status}`;
        throw new Error(String(message).slice(0, 180));
      }

      const models = Array.isArray(result?.data) ? result.data
        : Array.isArray(result?.models) ? result.models
        : Array.isArray(result) ? result : [];
      const ids = [...new Set(models.map((model) => typeof model === "string" ? model : model?.id).filter((id) => typeof id === "string" && id.trim()))];
      if (!ids.length) throw new Error("接口未返回模型列表，请确认网关支持 OpenAI 兼容的 /v1/models");

      const select = $("f-model");
      const previous = select.value || preferredModel;
      const options = ids.map((id) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = id;
        return option;
      });
      select.replaceChildren(...options);
      select.disabled = false;
      select.value = ids.includes(previous) ? previous : ids[0];
      preferredModel = select.value;
      select.dispatchEvent(new Event("change"));
      status.textContent = `已加载 ${ids.length} 个模型`;
    } catch (error) {
      status.textContent = `加载失败：${error.message}`;
    } finally {
      button.disabled = false;
    }
  });

  // ---- 发请求：同时支持普通 JSON 和 SSE 流式 ----
  async function send({ text, stream, gwKey, onDelta }) {
    const c = cfg();
    const headers = { "Content-Type": "application/json" };
    if (gwKey !== undefined && gwKey !== null && gwKey !== "") headers["x-gateway-key"] = gwKey;
    if (c.upKey) headers["Authorization"] = "Bearer " + c.upKey;
    const body = { model: c.model, stream, messages: [{ role: "user", content: text }] };

    const t0 = performance.now();
    const res = await fetch(c.url, { method: "POST", headers, body: JSON.stringify(body) });
    const type = res.headers.get("content-type") || "";
    let raw = "", content = "";

    if (res.body && type.includes("text/event-stream")) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const chunk = dec.decode(value, { stream: true });
        raw += chunk; buf += chunk;
        const lines = buf.split(/\r?\n/);
        buf = lines.pop();
        for (const line of lines) {
          const m = line.match(/^data:\s?(.*)$/);
          if (!m || m[1] === "[DONE]") continue;
          try {
            const j = JSON.parse(m[1]);
            const d = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content ?? "";
            if (d) { content += d; onDelta && onDelta(content); }
          } catch (_) {}
        }
      }
    } else {
      raw = await res.text();
      try {
        const j = JSON.parse(raw);
        content = j.choices?.[0]?.message?.content ?? j.error?.message ?? j.errmsg ?? j.message ?? raw;
      } catch (_) { content = raw; }
      onDelta && onDelta(content);
    }
    return { status: res.status, ms: Math.round(performance.now() - t0), raw, content, reqHeaders: headers, reqBody: body };
  }

  // key 第一次明文展示，之后遮盖
  function fmtRequest(r) {
    const h = { ...r.reqHeaders };
    if (h["x-gateway-key"]) {
      if (!keyPrinted) {
        keyPrinted = true;
        // 明文保留，控制台也打印一次
        console.log("[网关 key 首次展示]", h["x-gateway-key"]);
      } else {
        h["x-gateway-key"] = mask(h["x-gateway-key"]);
      }
    }
    if (h["Authorization"]) h["Authorization"] = "Bearer " + mask(h["Authorization"].slice(7));
    return JSON.stringify({ headers: h, body: r.reqBody }, null, 2);
  }
  const mask = (s) => (s.length <= 8 ? "****" : s.slice(0, 4) + "…" + s.slice(-4));

  function setStamp(el, state, text) {
    el.className = "stamp " + state;
    el.textContent = text;
    if (["pass", "fail", "warn"].includes(state)) {
      void el.offsetWidth;
      el.classList.add("land");
    }
  }

  // ---- 手动发送 ----
  const presets = [
    ["普通问题", "用三句话介绍一下杭州"],
    ["含手机号", "我的手机号是 13800138000，请原样复述"],
    ["含邮箱", "把 zhangsan@example.com 这个邮箱原样写出来"],
    ["含密钥", "帮我检查这个 key 格式对不对：sk-abcdefghijklmnopqrstuvwxyz123456"],
    ["含敏感词", null],
  ];
  presets.forEach(([label, text]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", () => {
      $("pg-input").value = text ?? `请解释一下：${cfg().word}`;
      $("pg-input").focus();
    });
    $("presets").appendChild(b);
  });

  $("pg-send").addEventListener("click", async () => {
    const text = $("pg-input").value.trim();
    if (!text) { $("pg-input").focus(); return; }
    const noKey = $("pg-nokey").checked;
    const c = cfg();
    if (!c.model) { banner("请先选择模型（点击"加载模型"）。"); $("load-models").focus(); return; }
    if (location.protocol === "file:") {
      banner("请在项目根目录运行 bash start.sh，再从 http://localhost:8090 打开页面。");
      return;
    }
    banner("");

    const btn = $("pg-send");
    const ans = $("pg-answer");
    btn.disabled = true;
    setStamp($("pg-stamp"), "run", "发送中");
    $("pg-verdict").textContent = "";
    ans.classList.remove("empty");
    ans.textContent = "";
    $("pg-raw").textContent = "（等待响应）";

    try {
      const gwKey = noKey ? null : (c.gwKey || null);
      const r = await send({
        text, stream: $("pg-stream").checked, gwKey,
        onDelta: (s) => { ans.textContent = s; ans.scrollTop = ans.scrollHeight; },
      });
      $("pg-raw").textContent = `HTTP ${r.status}\n\n` + (r.raw || "（空）");
      if (!r.content) { ans.textContent = "（没有回复内容）"; ans.classList.add("empty"); }

      // 展示请求（含 key 首次明文）
      $("pg-raw").textContent = `POST ${c.url}\n` + fmtRequest(r) + `\n\n--- 响应 HTTP ${r.status} ---\n\n` + (r.raw || "（空）");

      let state = "pass", label = "已放行", why = `HTTP ${r.status}，耗时 ${r.ms} ms`;
      if (r.status === 401 || r.status === 403) { state = "fail"; label = "未认证"; why = "网关拒绝了请求：key 缺失、错误或无权访问该路由"; }
      else if (r.status === 429) { state = "warn"; label = "被限流"; why = "超出 token 限流额度，稍后再试"; }
      else if (r.content.includes(c.deny) || r.raw.includes(c.deny)) { state = "fail"; label = "已拦截"; why = "内容命中敏感词，被网关拦截"; }
      else if (r.status >= 400) { state = "warn"; label = "出错"; why = `上游返回 HTTP ${r.status}，展开原始响应查看原因`; }
      else if (/\*{4}/.test(r.content) || /[0-9a-f]{32}/.test(r.content)) { label = "已脱敏放行"; why = "回复中出现了脱敏后的内容"; }
      setStamp($("pg-stamp"), state, label);
      $("pg-verdict").textContent = why;
    } catch (err) {
      setStamp($("pg-stamp"), "fail", "发送失败");
      $("pg-verdict").textContent = "请求没有发出去：" + err.message;
      $("pg-raw").textContent = "（无响应）";
    } finally {
      btn.disabled = false;
    }
  });

  $("pg-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("pg-send").click();
  });
})();
</script>
</body>
</html>
